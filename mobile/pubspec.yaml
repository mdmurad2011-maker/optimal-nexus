name: optimal_nexus
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/optimal_nexus_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/optimal_nexus_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  windows:
    generate: true
    image_path: "assets/branding/optimal_nexus_icon.png"
    icon_size: 256

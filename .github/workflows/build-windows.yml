name: Build OPTIMAL NEXUS Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: mobile
        run: flutter analyze

      - name: Build Windows release
        working-directory: mobile
        run: flutter build windows --release

      - name: Create Windows package
        working-directory: mobile
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "optimal-nexus-windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: optimal-nexus-windows
          path: mobile/optimal-nexus-windows.zip
